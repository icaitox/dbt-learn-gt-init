models:
  - name: stg_jaffle_shop__customers
    describption: one unique customer per row
    columns:
     - name: customer_id
       description: Primary key
       data_tests:
         - not_null
         - unique
         
  - name: stg_jaffle_shop__orders
    columns:
     - name: order_id
       describption: id for the order
       data_tests:
         - not_null
         - unique

     - name: status
       describption: '{{ doc("order_status") }}'
       data_tests:
         - accepted_values:
            arguments:
              values: ["placed", "shipped", "completed", "returned", "return_pending"]

     - name: customer_id
       data_tests:
         - relationships:
            arguments:
              to: ref('stg_jaffle_shop__customers')
              field: customer_id
